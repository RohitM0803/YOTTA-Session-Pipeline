[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yotta-session-pipeline"
version = "0.1.0"
description = "A clickstream event validation, deduplication, and sessionization pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
